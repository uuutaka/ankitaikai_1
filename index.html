<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6fb">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="暗記大会">
<meta name="mobile-web-app-capable" content="yes">
<title>暗記大会</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e0ea;--accent:#2457d6;--accent2:#173d98;--soft:#edf3ff;--shadow:0 12px 32px rgba(23,32,51,.10);--radius:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}
h1{font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15}
.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--accent2);padding:8px 11px;border-radius:999px;white-space:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}
.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:800;color:#475467;margin:0 0 7px}
select,input{width:100%;height:48px;border:1px solid #cfd7e4;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;padding:0 12px;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.12)}
.actions{display:flex;gap:10px;margin-top:17px}
button{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.primary:active{background:var(--accent2)}
.secondary{background:#e9eef6;color:#344054}
.ghost{background:#fff;border:1px solid var(--line);color:#475467}
button:disabled{opacity:.38}
.small-note{font-size:12px;color:var(--muted);line-height:1.6;margin:13px 0 0}
.hidden{display:none!important}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:3px 2px 10px}
.quiz-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;flex:1}
.progress-label{font-size:13px;font-weight:850;color:#344054;text-align:right}
.source{font-size:12px;color:var(--muted);text-align:right}
.top-home-btn{background:#fff;border:1px solid var(--line);color:#475467;min-height:42px;padding:0 14px;white-space:nowrap;flex:0 0 auto}
.progress-track{height:6px;background:#e2e7ef;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress-bar{height:100%;background:var(--accent);width:0;transition:width .18s ease}
.scene{perspective:1200px;min-height:min(58vh,520px);height:min(58vh,520px)}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 20px;overflow:auto}
.back{transform:rotateY(180deg);background:#fbfcff}
.face-label{font-size:12px;font-weight:850;color:var(--accent2);background:var(--soft);padding:6px 10px;border-radius:999px;align-self:flex-start}
.face-body{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
.question{font-size:clamp(20px,5.2vw,27px);font-weight:750;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.answer{font-size:clamp(25px,7vw,36px);font-weight:850;line-height:1.55;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.tap-hint{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;padding-top:12px;background:linear-gradient(to bottom,rgba(243,246,251,0),var(--bg) 30%)}
.nav-row{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}
.flip-btn{width:100%;margin-bottom:10px;background:#fff;border:1px solid #bfc9d8;color:var(--accent2)}
.finish-panel h2{margin:0 0 8px;font-size:27px}
.finish-panel p{margin:0;color:var(--muted);line-height:1.7}
@media(max-width:560px){
 .app{padding:12px 11px calc(22px + env(safe-area-inset-bottom))}
 .grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .scene{height:58vh;min-height:390px;max-height:560px}
 .face{padding:18px 16px}
 .question{font-size:20px;line-height:1.72}
 .answer{font-size:29px}
 .quiz-top{align-items:flex-start}
 .quiz-meta{align-items:flex-end}
 .nav-row{grid-template-columns:1fr 1.45fr}
}
@media(max-height:700px) and (max-width:560px){.scene{height:52vh;min-height:330px}.face-body{padding:10px 0}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>暗記大会</h1><div id="totalBadge" class="badge">読み込み中</div></header>

<section id="setup" class="panel">
<p class="lead">カードの表に問題、裏に答えを表示します。カードをタップすると表裏が切り替わります。</p>
<div class="grid">
 <div class="field"><label for="rangeMode">出題範囲</label><select id="rangeMode"><option value="new" selected>第2回 新規範囲のみ</option><option value="all">第2回 全範囲</option><option value="round1">第1回範囲のみ</option></select></div>
 <div class="field"><label for="subject">分野</label><select id="subject"><option value="">全分野</option></select></div>
 <div class="field"><label for="count">カード枚数</label><select id="count"><option value="5">5枚</option><option value="10">10枚</option><option value="20">20枚</option><option value="30">30枚</option><option value="50">50枚</option><option value="all" selected>全部</option></select></div>
 <div class="field"><label for="order">出題順</label><select id="order"><option value="random" selected>ランダム</option><option value="sequential">順番</option></select></div>
 <div class="field full"><label for="keyword">キーワード（任意）</label><input id="keyword" type="search" placeholder="例：公民、火山、光" autocomplete="off"></div>
</div>
<div class="actions"><button id="startBtn" class="primary" type="button" disabled>カードを開始</button></div>
<p id="dataStatus" class="small-note">問題データを読み込んでいます。</p>
<p class="small-note">答えを書く欄はありません。頭の中で答えてからカードをタップして確認してください。</p>
</section>

<section id="quiz" class="hidden">
 <div class="quiz-top"><button id="homeBtn" class="top-home-btn" type="button">← ホーム</button><div class="quiz-meta"><div id="progressLabel" class="progress-label"></div><div id="source" class="source"></div></div></div>
 <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
 <div class="scene" aria-live="polite">
   <div id="card" class="card" role="button" tabindex="0" aria-label="カード。タップで答えを表示">
     <div class="face front"><div class="face-label">問題</div><div class="face-body"><div id="questionText" class="question"></div></div><div class="tap-hint">タップして答えを見る</div></div>
     <div class="face back"><div class="face-label">答え</div><div class="face-body"><div id="answerText" class="answer"></div></div><div class="tap-hint">タップして問題に戻る</div></div>
   </div>
 </div>
 <div class="nav">
   <button id="flipBtn" class="flip-btn" type="button">答えを見る</button>
   <div class="nav-row"><button id="prevBtn" class="secondary" type="button">前へ</button><button id="nextBtn" class="primary" type="button">次へ</button></div>
 </div>
</section>

<section id="finish" class="panel finish-panel hidden">
 <h2>終了</h2><p id="finishText"></p>
 <div class="actions"><button id="againBtn" class="secondary" type="button">同じ条件でもう一度</button><button id="settingsBtn" class="primary" type="button">設定に戻る</button></div>
</section>
</div>
<script>
let DATA=[];
let DATA_META=null;
const $=id=>document.getElementById(id);
const el={setup:$('setup'),quiz:$('quiz'),finish:$('finish'),rangeMode:$('rangeMode'),subject:$('subject'),count:$('count'),order:$('order'),keyword:$('keyword'),start:$('startBtn'),card:$('card'),q:$('questionText'),a:$('answerText'),progress:$('progressLabel'),bar:$('progressBar'),source:$('source'),flip:$('flipBtn'),prev:$('prevBtn'),next:$('nextBtn'),home:$('homeBtn'),again:$('againBtn'),settings:$('settingsBtn'),finishText:$('finishText'),badge:$('totalBadge'),status:$('dataStatus')};
let session=null;

async function loadData(){
  try{
    const res=await fetch('./questions.json',{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload=await res.json();
    if(!payload || !Array.isArray(payload.questions)) throw new Error('questions.json の形式が不正です');
    DATA=payload.questions;
    DATA_META=payload.meta||{};
    if(!DATA.length) throw new Error('問題データが空です');
    updateSubjects();
    const newTotal=Number(DATA_META.new_total ?? DATA.filter(x=>!x.round1).length);
    const round1Total=Number(DATA_META.round1_total ?? DATA.filter(x=>x.round1).length);
    el.badge.textContent=`全 ${DATA.length} 問`;
    const generated=DATA_META.generated_at ? ` / データ更新: ${String(DATA_META.generated_at).slice(0,10)}` : '';
    el.status.textContent=`第2回 新規範囲 ${newTotal}問 / 第1回範囲 ${round1Total}問 / 全範囲 ${DATA.length}問${generated}`;
    el.start.disabled=false;
  }catch(err){
    console.error(err);
    el.badge.textContent='読込エラー';
    el.status.textContent='questions.json を読み込めませんでした。GitHub Pagesの公開URLから開いているか確認してください。';
    el.start.disabled=true;
  }
}
function inSelectedRange(x){
 const mode=el.rangeMode.value;
 if(mode==='new') return !x.round1;
 if(mode==='round1') return !!x.round1;
 return true;
}
function updateSubjects(){
 const previous=el.subject.value;
 const subjects=[...new Set(DATA.filter(inSelectedRange).map(x=>x.subject))];
 el.subject.innerHTML='<option value="">全分野</option>';
 for(const s of subjects){const o=document.createElement('option');o.value=s;o.textContent=s;el.subject.appendChild(o)}
 if(subjects.includes(previous)) el.subject.value=previous;
}
function pool(){
 const s=el.subject.value,k=el.keyword.value.trim().toLowerCase();
 return DATA.filter(x=>inSelectedRange(x)&&(!s||x.subject===s)&&(!k||(x.question+' '+x.answer).toLowerCase().includes(k)));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selected(){let a=pool();if(el.order.value==='random')a=shuffle(a);const n=el.count.value==='all'?a.length:Math.min(+el.count.value,a.length);return a.slice(0,n)}
function start(){const cards=selected();if(!cards.length){alert('条件に一致するカードがありません。');return}session={cards,index:0};el.setup.classList.add('hidden');el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
function isFlipped(){return el.card.classList.contains('flipped')}
function setFlip(v){el.card.classList.toggle('flipped',v);el.flip.textContent=v?'問題に戻る':'答えを見る';el.card.setAttribute('aria-label',v?'答え。タップで問題に戻る':'問題。タップで答えを表示')}
function toggleFlip(){setFlip(!isFlipped())}
function render(){
 const x=session.cards[session.index],i=session.index,n=session.cards.length;
 setFlip(false);el.q.textContent=x.question;el.a.textContent=x.answer||'（解答データなし）';
 el.progress.textContent=`${i+1} / ${n} 枚`;el.bar.style.width=`${(i+1)/n*100}%`;el.source.textContent=`${x.subject} / No. ${x.no}`;
 el.prev.disabled=i===0;el.next.textContent=i===n-1?'終了':'次へ';
}
function prev(){if(session.index>0){session.index--;render();scrollToTop()}}
function next(){if(session.index<session.cards.length-1){session.index++;render();scrollToTop()}else finish()}
function home(){session=null;setFlip(false);el.quiz.classList.add('hidden');el.finish.classList.add('hidden');el.setup.classList.remove('hidden');scrollToTop()}
function finish(){el.quiz.classList.add('hidden');el.finish.classList.remove('hidden');el.finishText.textContent=`${session.cards.length}枚のカードを確認しました。`;scrollToTop()}
function again(){if(!session)return;let cards=selected();if(!cards.length)return;session={cards,index:0};el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}
function settings(){el.finish.classList.add('hidden');el.quiz.classList.add('hidden');el.setup.classList.remove('hidden');scrollToTop()}
el.rangeMode.addEventListener('change',updateSubjects);el.start.addEventListener('click',start);el.card.addEventListener('click',toggleFlip);el.flip.addEventListener('click',toggleFlip);el.prev.addEventListener('click',prev);el.next.addEventListener('click',next);el.home.addEventListener('click',home);el.again.addEventListener('click',again);el.settings.addEventListener('click',settings);
el.card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip()}});
loadData();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Service Worker registration failed:', err);
    });
  });
}
</script>
</body></html>
