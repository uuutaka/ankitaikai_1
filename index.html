<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6fb">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="中学生単語カード">
<meta name="mobile-web-app-capable" content="yes">
<title>中学生 単語カード</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e0ea;--accent:#2457d6;--accent2:#173d98;--soft:#edf3ff;--shadow:0 12px 32px rgba(23,32,51,.10);--radius:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
button{touch-action:manipulation}
.app{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}
h1{font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15}
.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--accent2);padding:8px 11px;border-radius:999px;white-space:nowrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}
.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:800;color:#475467;margin:0 0 7px}
select,input{width:100%;height:48px;border:1px solid #cfd7e4;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;padding:0 12px;outline:none}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.12)}
.actions{display:flex;gap:10px;margin-top:17px}
button{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;flex:1}
.primary:active{background:var(--accent2)}
.secondary{background:#e9eef6;color:#344054}
.ghost{background:#fff;border:1px solid var(--line);color:#475467}
button:disabled{opacity:.38}
.small-note{font-size:12px;color:var(--muted);line-height:1.6;margin:13px 0 0}
.hidden{display:none!important}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:3px 2px 10px}
.progress-label{font-size:13px;font-weight:850;color:#344054}
.source{font-size:12px;color:var(--muted);text-align:right}
.progress-track{height:6px;background:#e2e7ef;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress-bar{height:100%;background:var(--accent);width:0;transition:width .18s ease}
.scene{perspective:1200px;min-height:min(58vh,520px);height:min(58vh,520px)}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1);cursor:pointer;-webkit-tap-highlight-color:transparent}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 20px;overflow:auto}
.back{transform:rotateY(180deg);background:#fbfcff}
.face-label{font-size:12px;font-weight:850;color:var(--accent2);background:var(--soft);padding:6px 10px;border-radius:999px;align-self:flex-start}
.face-body{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
.question{font-size:clamp(20px,5.2vw,27px);font-weight:750;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.answer{font-size:clamp(25px,7vw,36px);font-weight:850;line-height:1.55;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.tap-hint{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;padding-top:12px;background:linear-gradient(to bottom,rgba(243,246,251,0),var(--bg) 30%)}
.nav-row{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}
.flip-btn{width:100%;margin-bottom:10px;background:#fff;border:1px solid #bfc9d8;color:var(--accent2)}
.finish-panel h2{margin:0 0 8px;font-size:27px}
.finish-panel p{margin:0;color:var(--muted);line-height:1.7}
@media(max-width:560px){
 .app{padding:12px 11px calc(22px + env(safe-area-inset-bottom))}
 .grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .scene{height:58vh;min-height:390px;max-height:560px}
 .face{padding:18px 16px}
 .question{font-size:20px;line-height:1.72}
 .answer{font-size:29px}
 .nav-row{grid-template-columns:1fr 1.45fr}
}
@media(max-height:700px) and (max-width:560px){.scene{height:52vh;min-height:330px}.face-body{padding:10px 0}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>中学生 単語カード</h1><div class="badge">全 872 問</div></header>

<section id="setup" class="panel">
<p class="lead">カードの表に問題、裏に答えを表示します。カードをタップすると表裏が切り替わります。</p>
<div class="grid">
 <div class="field"><label for="subject">分野</label><select id="subject"><option value="">全分野</option></select></div>
 <div class="field"><label for="unit">単元番号</label><select id="unit"><option value="">すべて</option></select></div>
 <div class="field"><label for="count">カード枚数</label><select id="count"><option value="5">5枚</option><option value="10" selected>10枚</option><option value="20">20枚</option><option value="30">30枚</option><option value="50">50枚</option><option value="all">全部</option></select></div>
 <div class="field"><label for="order">出題順</label><select id="order"><option value="random" selected>ランダム</option><option value="sequential">順番</option></select></div>
 <div class="field full"><label for="keyword">キーワード（任意）</label><input id="keyword" type="search" placeholder="例：江戸、火山、光" autocomplete="off"></div>
</div>
<div class="actions"><button id="startBtn" class="primary" type="button">カードを開始</button></div>
<p class="small-note">答えを書く欄はありません。頭の中で答えてからカードをタップして確認してください。</p>
</section>

<section id="quiz" class="hidden">
 <div class="quiz-top"><div id="progressLabel" class="progress-label"></div><div id="source" class="source"></div></div>
 <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
 <div class="scene" aria-live="polite">
   <div id="card" class="card" role="button" tabindex="0" aria-label="カード。タップで答えを表示">
     <div class="face front"><div class="face-label">問題</div><div class="face-body"><div id="questionText" class="question"></div></div><div class="tap-hint">タップして答えを見る</div></div>
     <div class="face back"><div class="face-label">答え</div><div class="face-body"><div id="answerText" class="answer"></div></div><div class="tap-hint">タップして問題に戻る</div></div>
   </div>
 </div>
 <div class="nav">
   <button id="flipBtn" class="flip-btn" type="button">答えを見る</button>
   <div class="nav-row"><button id="prevBtn" class="secondary" type="button">前へ</button><button id="nextBtn" class="primary" type="button">次へ</button></div>
 </div>
</section>

<section id="finish" class="panel finish-panel hidden">
 <h2>終了</h2><p id="finishText"></p>
 <div class="actions"><button id="againBtn" class="secondary" type="button">同じ条件でもう一度</button><button id="settingsBtn" class="primary" type="button">設定に戻る</button></div>
</section>
</div>
<script>
const DATA=[{"subject":"地理","course":"社","unit":1,"no":1,"question":"地球の赤道を一周したときの距離は約何kmか。","answer":"約4万km"},{"subject":"地理","course":"社","unit":1,"no":2,"question":"北半球が夏至のとき、太陽が真上にくる緯線を何というか、漢字で書け。","answer":"北回帰線"},{"subject":"地理","course":"社","unit":1,"no":3,"question":"平行に引かれた経線と緯線が互いに直線で垂直に交わり、角度が正しく、おもに航海図などに利用される図法を何というか。","answer":"メルカトル図法"},{"subject":"地理","course":"社","unit":1,"no":4,"question":"日本列島の太平洋側を流れる暖流を何というか、漢字で書け。","answer":"日本海流（黒潮）"},{"subject":"地理","course":"社","unit":1,"no":5,"question":"初夏に東北地方の太平洋側に吹く冷たい風を何というか。","answer":"やませ"},{"subject":"地理","course":"社","unit":1,"no":6,"question":"風が山を越えるとき、風下側で気温が上昇し乾燥する現象を何というか。","answer":"フェーン現象"},{"subject":"地理","course":"社","unit":1,"no":7,"question":"都市部の気温が周辺部より高くなる現象を何というか。","answer":"ヒートアイランド現象"},{"subject":"地理","course":"社","unit":1,"no":8,"question":"2018年に廃止された、米の作付面積を制限し、米の生産量を減らす政策を何というか、漢字で書け。","answer":"減反政策"},{"subject":"地理","course":"社","unit":1,"no":9,"question":"冬に雪が多いため、夏に稲作を中心に農業を行っている地域のことを何というか、漢字で書け。","answer":"水田単作地帯"},{"subject":"地理","course":"社","unit":1,"no":10,"question":"大都市周辺でおもに野菜や花きなどを中心に栽培し、出荷する農業を何というか、漢字で書け。","answer":"近郊農業"},{"subject":"地理","course":"社","unit":1,"no":11,"question":"冬でも温暖な気候とビニールハウスなどの施設を利用して、夏野菜を冬から春にかけて出荷する栽培方法を何というか、漢字4字で書け。","answer":"促成栽培"},{"subject":"地理","course":"社","unit":1,"no":12,"question":"乳用牛から生乳を生産したり、乳製品を製造する農業を何というか、漢字で書け。","answer":"酪農"},{"subject":"地理","course":"社","unit":1,"no":13,"question":"海藻やプランクトンがよく育つ水深200m位までの海底地形を何というか、漢字で書け。","answer":"大陸棚"},{"subject":"地理","course":"社","unit":1,"no":14,"question":"山地が沈んでできた、漁港や養殖場に適する複雑な海岸地形を何というか。","answer":"リアス海岸"},{"subject":"地理","course":"社","unit":1,"no":15,"question":"魚を卵から稚魚まで育て海や川に放流し、成魚になってから獲る漁業を何というか、漢字で書け。","answer":"栽培漁業"},{"subject":"地理","course":"社","unit":1,"no":16,"question":"沿岸から200海里以内の水域で、沿岸国がその域内の水産資源や鉱産資源の利用を認められている海域を何というか、漢字で書け。","answer":"排他的経済水域"},{"subject":"地理","course":"社","unit":2,"no":17,"question":"次の県の代表的な石油化学工業都市の名前を漢字で書け。\n①三重県\n②神奈川県\n③岡山県\n④千葉県","answer":"①四日市市　②川崎市　③倉敷市　④市原市"},{"subject":"地理","course":"社","unit":2,"no":18,"question":"次の道県の代表的な製紙・パルプ工業都市の名前を漢字で書け。\n①静岡県\n②北海道","answer":"①富士市　②苫小牧市"},{"subject":"地理","course":"社","unit":2,"no":19,"question":"九谷焼・加賀友禅・輪島塗が伝統工業としてさかんに生産されている都道府県はどこか、漢字で書け。","answer":"石川県"},{"subject":"地理","course":"社","unit":2,"no":20,"question":"将棋の駒が伝統工業としてさかんに生産されている都道府県はどこか、漢字で書け。","answer":"山形県"},{"subject":"地理","course":"社","unit":2,"no":21,"question":"南部鉄器が伝統工業としてさかんに生産されている都道府県はどこか、漢字で書け。","answer":"岩手県"},{"subject":"地理","course":"社","unit":2,"no":22,"question":"観光業などの第三次産業の就業者割合が全国第2位であり、出生率が全国で最も高い都道府県はどこか、漢字で書け。","answer":"沖縄県"},{"subject":"地理","course":"社","unit":2,"no":23,"question":"政令指定都市が県内に3つあり、そのうちの1都市は全国の政令指定都市の中で最も人口が多い都市である。この都道府県はどこか、漢字で書け。","answer":"神奈川県"},{"subject":"地理","course":"社","unit":2,"no":24,"question":"高浜・美浜など若狭湾の海岸沿いの町に原子力発電所が建てられている。また国産メガネのフレームのほとんどは鯖江で生産されている。この都道府県はどこか、漢字で書け。","answer":"福井県"},{"subject":"地理","course":"社","unit":2,"no":25,"question":"太陽・風力・地熱などのように、くり返し利用することができるエネルギーを何というか。","answer":"再生可能エネルギー"},{"subject":"地理","course":"社","unit":2,"no":26,"question":"化石燃料などの利用による地球規模の気温の上昇現象を何というか、漢字で書け。","answer":"地球温暖化"},{"subject":"地理","course":"社","unit":2,"no":27,"question":"26（地球規模の気温の上昇現象）の原因となる二酸化炭素やメタンガスなどを総称して何というか。","answer":"温室効果ガス"},{"subject":"地理","course":"社","unit":2,"no":28,"question":"二酸化炭素やメタンガスの削減のために注目されている、トウモロコシやサトウキビなどを原料にした燃料を何というか。","answer":"バイオ燃料"},{"subject":"地理","course":"社","unit":3,"no":29,"question":"湿地とそこに生息する水鳥を保護するための条約を何というか。","answer":"ラムサール条約"},{"subject":"地理","course":"社","unit":3,"no":30,"question":"自然環境などを資源とし、その資源を損なうことなく、体験したり学んだりする観光を何というか、カタカナで書け。","answer":"エコツーリズム"},{"subject":"地理","course":"社","unit":3,"no":31,"question":"関東地方南部から北九州沿岸部の工業が発達した帯状の地域のことを何というか。","answer":"太平洋ベルト"},{"subject":"地理","course":"社","unit":3,"no":32,"question":"エネルギー供給源が石炭から石油中心に変化したことを何というか。","answer":"エネルギー革命"},{"subject":"地理","course":"社","unit":3,"no":33,"question":"一方的に貿易黒字が続いた場合に、相手国の経済に不利益が生じ、その結果相手国と対立する状況を ","unit":4,"no":69,"question":"2本の電熱線の並列回路で、各部分で大きさが等しくなるのは電流と電圧のどちらか。","answer":"電圧"},{"subject":"物理","course":"理","unit":4,"no":70,"question":"電熱線に流れる電流の強さが、電熱線に加わる電圧の大きさに比例する関係を何の法則というか。","answer":"オームの法則"},{"subject":"物理","course":"理","unit":4,"no":71,"question":"鉄や銅などの金属のように、電流を通しやすい物質を何というか。","answer":"導体"},{"subject":"物理","course":"理","unit":4,"no":72,"question":"ガラスやポリエチレンやゴムなどのように、抵抗が大きく電流が非常に流れにくい物質を何というか。","answer":"不導体（絶縁体）"},{"subject":"物理","course":"理","unit":4,"no":73,"question":"電気抵抗をR［Ω］、電圧をV［V］、電流をI［A］で表すとき、オームの法則を式（VをI、Rを用いて）で表すとどうなるか。","answer":"V＝IR"},{"subject":"物理","course":"理","unit":4,"no":74,"question":"電熱線を並列につないだときの、回路全体の抵抗の値は大きくなるか、小さくなるか。","answer":"小さくなる"},{"subject":"物理","course":"理","unit":4,"no":75,"question":"乾電池の＋極と－極を導線だけでつなぐと危険だが、このような回路を何というか。","answer":"ショート（短絡）"},{"subject":"物理","course":"理","unit":5,"no":76,"question":"磁力がはたらいている空間を何というか。","answer":"磁界"},{"subject":"物理","course":"理","unit":5,"no":77,"question":"方位磁針のN極が指す向きを順につないでできる線を何というか。","answer":"磁力線"},{"subject":"物理","course":"理","unit":5,"no":78,"question":"方位磁針のN極が指す向きを何というか。","answer":"磁界の向き"},{"subject":"物理","course":"理","unit":5,"no":79,"question":"地球を大きな磁石と考えると、北極は何極になるか。","answer":"S極"},{"subject":"物理","course":"理","unit":5,"no":80,"question":"導線に電流を流すと、そのまわりにはどのような形の磁界ができるか。","answer":"導線を中心とする同心円状"},{"subject":"物理","course":"理","unit":5,"no":81,"question":"導線に電流が流れる向きに見て、磁界の向きは右回りか、左回りか。","answer":"右回り"},{"subject":"物理","course":"理","unit":5,"no":82,"question":"磁界の弱いところの磁力線の間隔は広いか、狭いか。","answer":"広い"},{"subject":"物理","course":"理","unit":5,"no":83,"question":"コイルの巻き数を多くするほど、磁界の強さはどうなるか。","answer":"強くなる"},{"subject":"物理","course":"理","unit":5,"no":84,"question":"コイルに（鉄心を入れて）電流を流すと、コイルは何になるか。","answer":"電磁石"},{"subject":"物理","course":"理","unit":5,"no":85,"question":"磁界の中の導線に電流が流れると、導線が動き出す原理を利用したものに何があるか。","answer":"モーター"},{"subject":"物理","course":"理","unit":5,"no":86,"question":"コイルの中の磁界が変化すると、コイルに電流が流れる現象を何というか。","answer":"電磁誘導"},{"subject":"物理","course":"理"," function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selected(){let a=pool();if(el.order.value==='random')a=shuffle(a);const n=el.count.value==='all'?a.length:Math.min(+el.count.value,a.length);return a.slice(0,n)}
function start(){const cards=selected();if(!cards.length){alert('条件に一致するカードがありません。');return}session={cards,index:0};el.setup.classList.add('hidden');el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
function isFlipped(){return el.card.classList.contains('flipped')}
function setFlip(v){el.card.classList.toggle('flipped',v);el.flip.textContent=v?'問題に戻る':'答えを見る';el.card.setAttribute('aria-label',v?'答え。タップで問題に戻る':'問題。タップで答えを表示')}
function toggleFlip(){setFlip(!isFlipped())}
function render(){
 const x=session.cards[session.index],i=session.index,n=session.cards.length;
 setFlip(false);el.q.textContent=x.question;el.a.textContent=x.answer||'（解答データなし）';
 el.progress.textContent=`${i+1} / ${n} 枚`;el.bar.style.width=`${(i+1)/n*100}%`;el.source.textContent=`${x.subject} / 単元 ${x.unit} / No. ${x.no}`;
 el.prev.disabled=i===0;el.next.textContent=i===n-1?'終了':'次へ';
}
function prev(){if(session.index>0){session.index--;render();scrollToTop()}}
function next(){if(session.index<session.cards.length-1){session.index++;render();scrollToTop()}else finish()}
function finish(){el.quiz.classList.add('hidden');el.finish.classList.remove('hidden');el.finishText.textContent=`${session.cards.length}枚のカードを確認しました。`;scrollToTop()}
function again(){if(!session)return;let cards=selected();if(!cards.length)return;session={cards,index:0};el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}
function settings(){el.finish.classList.add('hidden');el.quiz.classList.add('hidden');el.setup.classList.remove('hidden');scrollToTop()}
el.subject.addEventListener('change',refreshUnits);el.start.addEventListener('click',start);el.card.addEventListener('click',toggleFlip);el.flip.addEventListener('click',toggleFlip);el.prev.addEventListener('click',prev);el.next.addEventListener('click',next);el.again.addEventListener('click',again);el.settings.addEventListener('click',settings);
el.card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip()}});
refreshUnits();
</script>
